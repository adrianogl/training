name: trAIning
options:
  bundleIdPrefix: dev.aglv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  TrainingKit:
    path: Packages/TrainingKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "3RLPE9T639"
targets:
  trAIning:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/CLAUDE.md"
          - Strength/Media/Images/**
          - Strength/Media/exercise-media.json
          - Strength/Media/CREDITS.md
      - path: App/Strength/Media/exercise-media.json
        buildPhase: resources
      - path: App/Strength/Media/Images
        type: folder
        buildPhase: resources
      - Shared
      - path: server/landing/versao.json
        buildPhase: resources
    dependencies:
      - target: TrainingWidgets
        embed: true
      - package: TrainingKit
        products:
          - Storage
          - Sync
          - GarminAPI
          - TrainingCore
          - FITReader
          - Metrics
          - WorkoutAnalysis
          - Narrative
          - Reports
          - Insights
          - RemoteSync
          - MFIT
          - HealthImport
    settings:
      base:
        PRODUCT_NAME: trAIning
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Training
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O app lê do Apple Saúde os treinos, rotas, frequência cardíaca, HRV, FC de repouso e sono para analisar os treinos e calcular a prontidão. Os dados ficam neste iPhone."
        CODE_SIGN_ENTITLEMENTS: App/trAIning.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: "O app pede o Face ID para mostrar ou copiar a chave de sincronização entre aparelhos."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.44.0"
        CURRENT_PROJECT_VERSION: "76"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLilac AppIconPistaLight AppIconPistaDark AppIconLilacLight AppIconLilacDark"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Build info
        basedOnDependencyAnalysis: false
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          COMMIT=$(git -C "$SRCROOT" rev-parse --short=8 HEAD 2>/dev/null || echo "")
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          /usr/libexec/PlistBuddy -c "Delete :TrainingCommit" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :TrainingBuiltAt" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :TrainingCommit string $COMMIT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :TrainingBuiltAt string $BUILT" "$PLIST"
      - name: Brand logos
        basedOnDependencyAnalysis: false
        script: |
          SRC="$HOME/.config/training-sync/brand-logos"
          DST="${TARGET_BUILD_DIR:?}/${UNLOCALIZED_RESOURCES_FOLDER_PATH:?}/BrandLogos"
          rm -rf "$DST"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            cp "$SRC"/*.png "$DST"/ 2>/dev/null || true
          fi
  TrainingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Training
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/TrainingWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.44.0"
        CURRENT_PROJECT_VERSION: "76"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: trAIning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/trAIning.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/trAIning"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  trAIning:
    build:
      targets:
        trAIning: all
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
      environmentVariables:
        TRAINING_TEST_HOST: "1"
