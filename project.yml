name: trAIning
options:
  bundleIdPrefix: dev.aglv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
packages:
  TrainingKit:
    path: Packages/TrainingKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "3RLPE9T639"
targets:
  trAIning:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: TrainingWidgets
        embed: true
      - package: TrainingKit
        products:
          - Storage
          - Sync
          - GarminAPI
          - TrainingCore
          - FITReader
          - Metrics
          - WorkoutAnalysis
          - Narrative
          - Reports
          - Insights
          - RemoteSync
          - MFIT
    settings:
      base:
        PRODUCT_NAME: trAIning
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Training
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O app lê só os treinos do Apple Health para avisar quando um treino termina e já tem análise."
        CODE_SIGN_ENTITLEMENTS: App/trAIning.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: "O app pede o Face ID para mostrar ou copiar a chave de sincronização entre aparelhos."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TrainingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Training
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/TrainingWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: trAIning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.training.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/trAIning.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/trAIning"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  trAIning:
    build:
      targets:
        trAIning: all
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
      environmentVariables:
        TRAINING_TEST_HOST: "1"
